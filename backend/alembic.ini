[alembic]
script_location = migrations
prepend_sys_path = .
# URL comes from SRE_DATABASE_URL via migrations/env.py; this is a fallback.
sqlalchemy.url = postgresql+psycopg://sre:sre@localhost:5432/sre

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
