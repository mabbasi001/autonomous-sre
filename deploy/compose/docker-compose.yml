name: autonomous-sre

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre          # local dev only; real deployments use Key Vault
      POSTGRES_DB: sre
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/containers/backend.Dockerfile
    environment:
      SRE_DATABASE_URL: postgresql+psycopg://sre_app:sre_app@postgres:5432/sre
      SRE_MIGRATION_DATABASE_URL: postgresql+psycopg://sre:sre@postgres:5432/sre
      SRE_ENVIRONMENT: development
      # Local-account login: OIDC off, local auth on. The signing key is a
      # local-dev default; override with SRE_AUTH_SECRET in the environment
      # (or deploy/compose/.env) for anything real.
      SRE_OIDC_TENANT_ID: ""
      SRE_AUTH_SECRET: ${SRE_AUTH_SECRET:-local-dev-only-session-signing-key-change-me}
      # AI diagnosis; read from deploy/compose/.env (gitignored). Empty = manual triage.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: deploy/containers/backend.Dockerfile
    environment:
      SRE_DATABASE_URL: postgresql+psycopg://sre_app:sre_app@postgres:5432/sre
      SRE_ENVIRONMENT: development
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: deploy/containers/dashboard.Dockerfile
    environment:
      SRE_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
