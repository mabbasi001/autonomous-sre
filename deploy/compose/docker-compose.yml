name: autonomous-sre

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sre
      POSTGRES_PASSWORD: sre          # local dev only; real deployments use Key Vault
      POSTGRES_DB: sre
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sre -d sre"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/containers/backend.Dockerfile
    environment:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@postgres:5432/sre
      SRE_ENVIRONMENT: development
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../..
      dockerfile: deploy/containers/backend.Dockerfile
    environment:
      SRE_DATABASE_URL: postgresql+psycopg://sre:sre@postgres:5432/sre
      SRE_ENVIRONMENT: development
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  web:
    image: nginx:alpine
    volumes:
      - ../../dashboard/public:/usr/share/nginx/html:ro
    ports:
      - "3000:80"

volumes:
  pgdata:
